apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-conf
  labels:
    app: casdoor
data:
  # NOTE: dataSourceName contains DB credentials.
  # ArgoCD is configured to ignore differences on this field (see argocd-application.yaml).
  # After initial sync, patch the dataSourceName out-of-band with the real password.
  app.conf: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    driverName = postgres
    dataSourceName = "user=casdoor password=CHANGE_ME host=casdoor-postgresql.casdoor.svc.cluster.local port=5432 sslmode=disable dbname=casdoor"
    dbName = casdoor
    origin = https://account.leonhardt.tech
    staticBaseUrl = https://cdn.casbin.org
