apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
  labels:
    app: casdoor
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: casdoor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: casdoor
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: init-config
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              echo 'appname = casdoor' > /work/app.conf
              echo 'httpport = 8000' >> /work/app.conf
              echo 'runmode = prod' >> /work/app.conf
              echo 'copyrequestbody = true' >> /work/app.conf
              echo 'driverName = postgres' >> /work/app.conf
              echo "dataSourceName = \"user=casdoor password=$DB_PASSWORD host=casdoor-postgresql.casdoor.svc.cluster.local port=5432 sslmode=disable dbname=casdoor\"" >> /work/app.conf
              echo 'dbName = casdoor' >> /work/app.conf
              echo 'origin = https://account.leonhardt.tech' >> /work/app.conf
              echo 'staticBaseUrl = https://cdn.casbin.org' >> /work/app.conf
              chmod 644 /work/app.conf
              echo '=== generated app.conf ==='
              cat /work/app.conf
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casdoor-postgresql
                  key: password
          volumeMounts:
            - name: conf-generated
              mountPath: /work
      containers:
        - name: casdoor
          image: ghcr.io/leonhardthust/casdoor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
          securityContext:
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: conf-generated
              mountPath: /conf
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: conf-generated
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: casdoor-data
