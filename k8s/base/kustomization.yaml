apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# ConfigMap casdoor-conf is NOT managed by ArgoCD because it contains
# the DB password in dataSourceName. It is maintained out-of-band.
# To create/patch it on the cluster:
#   kubectl apply -f k8s/base/configmap.yaml -n casdoor
#   (then patch dataSourceName with the real password)
